<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToDo App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section class="Todo-app">
        <header class="sticky-header">
            <h1>🚩🚩 ToDo App 🚩🚩</h1>
            <div id="js-task-box">
                <input type="text" placeholder="Enter your task" id="js-task-input">
                <input type="date" id="js-task-date">
                <button id="js-todo-add-btn">Add</button>
            </div>
        </header>
        <main>
            <div id="js-task-list"></div>
        </main>
    </section>
    <footer>
        &copy; CodeWithAkashAdak 2026. All rights reserved.
    </footer>
</body>
</html>
